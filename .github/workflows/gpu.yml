name: GPU Benchmark

on:
  push:
    branches: [ master, gouda, mcgouda ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  gpu-benchmark:
    runs-on: [ self-hosted, linux, x64, gpu ]
    env:
      DEBIAN_FRONTEND: noninteractive
      CUDACXX: /usr/local/cuda/bin/nvcc
      CLICOLOR_FORCE: 1
      LD_LIBRARY_PATH: /usr/local/cuda/lib64
    steps:
      - uses: actions/checkout@v4

      - name: Get deps
        run: mkdir -p ~/deps && mv ~/deps .

      - name: Get build
        run: mkdir -p ~/nigiri-build && mv ~/nigiri-build build

      - name: Configure
        run: cmake --preset cuda -DCMAKE_CUDA_ARCHITECTURES="native"

      - name: Build
        run: cmake --build --preset cuda --target nigiri-test nigiri-benchmark nigiri-import

      - name: nigiri-test
        run: ./build/cuda/nigiri-test

      - name: Save deps
        if: always()
        run: mv deps ~

      - name: Import Germany
        run: |
          ./build/cuda/nigiri-import -r --ignore -i "$HOME/ci-data/ger" \
            -o tt.bin \
            -s 2026-07-01 -n 14 \
            --link_stop_distance 100 \
            --merge_dupes_intra_source true \
            --merge_dupes_inter_source true \
            --adjust_footpaths true \
            --max_footpath_length 12

      - name: Validate Germany (vias=0, CPU + GPU)
        run: |
          ./build/cuda/nigiri-benchmark -p tt.bin \
            --engines cpu gpu \
            --algo range pong mcraptor \
            --modes s2s c2c \
            --dirs fwd bwd \
            -n 25

      - name: Validate Germany (all criteria, CPU + GPU)
        run: |
          ./build/cuda/nigiri-benchmark -p tt.bin \
            --engines cpu gpu \
            --algo mcraptor-all \
            --modes s2s c2c \
            --dirs fwd bwd \
            --threads 8 \
            -n 10

      # BMRAPP (all criteria): CPU, GPU with the mc phases on the CPU and all on
      # the GPU must find the same restricted set, containing plain pong's
      # (dep, arr, transfers) front
      - name: Validate Germany (bmrapp, CPU + GPU)
        run: |
          ./build/cuda/nigiri-benchmark -p tt.bin \
            --engines cpu gpu \
            --algo pong bmrapp \
            --bmrap_gpu_mc 0 1 \
            --modes s2s c2c \
            --dirs fwd bwd \
            --gpu_states 1 \
            -n 25

      # BMRAPP must equal the range McRAPTOR over all criteria cut down by the
      # restricted-set definition (mcraptor-restricted, CPU), criteria and all,
      # on every journey the reference can decide. Every step also validates
      # each cell's legs against the timetable and their criteria.
      - name: Validate Germany (bmrapp vs restricted mcraptor, CPU + GPU)
        run: |
          ./build/cuda/nigiri-benchmark -p tt.bin \
            --engines cpu gpu \
            --algo bmrapp mcraptor-restricted \
            --bmrap_gpu_mc 0 1 \
            --modes s2s c2c \
            --dirs fwd bwd \
            --threads 8 \
            --gpu_states 1 \
            -n 10

      # the same, extending against the search direction as a later page does:
      # bmrapp's opposed path (anchor set from a range search up front)
      - name: Validate Germany (bmrapp vs restricted mcraptor, opposed)
        run: |
          ./build/cuda/nigiri-benchmark -p tt.bin \
            --engines cpu gpu \
            --algo bmrapp mcraptor-restricted \
            --bmrap_gpu_mc 0 1 \
            --modes s2s c2c \
            --dirs fwd-opp bwd-opp \
            --threads 8 \
            --gpu_states 1 \
            -n 10

      - name: Validate Germany (vias=1, CPU)
        run: |
          ./build/cuda/nigiri-benchmark -p tt.bin \
            --engines cpu \
            --algo range pong \
            --modes s2s c2c \
            --dirs fwd bwd \
            --vias 1 \
            -n 10

      - name: Validate Germany (vias=2, CPU)
        run: |
          ./build/cuda/nigiri-benchmark -p tt.bin \
            --engines cpu \
            --algo range pong \
            --modes s2s c2c \
            --dirs fwd bwd \
            --vias 2 \
            -n 10

      - name: Save build
        if: always()
        run: mv build ~/nigiri-build
