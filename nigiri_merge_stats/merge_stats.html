<!doctype html><meta charset="utf-8"><title>merge stats</title>
<style>
body{font-family:system-ui,sans-serif;font-size:14px;margin:16px}
table{width:100%;table-layout:fixed;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:2px 5px;text-align:left}
tr.f{cursor:pointer}
tr.a{background:#f7f7f7}
tr.a td:first-child{padding-left:20px}
tr.a[hidden]{display:none}
</style>
<table>
  <colgroup>
    <col>
    <col style="width:6em">
    <col style="width:6em">
    <col>
    <col style="width:7em">
    <col style="width:7em">
  </colgroup>
  <tr>
    <th>feed A</th>
    <th>A in B</th>
    <th>B in A</th>
    <th>feed B</th>
    <th>unique A</th>
    <th>unique B</th>
  </tr>
  <tr class="f" onclick='t(0)'>
    <td>feed-a</td>
    <td>1 (100.0%)</td>
    <td>1 (100.0%)</td>
    <td>feed-b</td>
    <td>0 (0.0%)</td>
    <td>0 (0.0%)</td>
  </tr>
  <tr class="a" data-r="0" hidden>
    <td>Agency a</td>
    <td>1 (100.0%)</td>
    <td>1 (100.0%)</td>
    <td>Agency b</td>
    <td>0 (0.0%)</td>
    <td>0 (0.0%)</td>
  </tr>
  <tr class="f" onclick='t(1)'>
    <td>feed-b</td>
    <td>1 (100.0%)</td>
    <td>1 (100.0%)</td>
    <td>feed-a</td>
    <td>0 (0.0%)</td>
    <td>0 (0.0%)</td>
  </tr>
  <tr class="a" data-r="1" hidden>
    <td>Agency b</td>
    <td>1 (100.0%)</td>
    <td>1 (100.0%)</td>
    <td>Agency a</td>
    <td>0 (0.0%)</td>
    <td>0 (0.0%)</td>
  </tr>
</table>
<script>
function t(i) {
  const rows = document.querySelectorAll('tr.a[data-r="' + i + '"]');
  for (const r of rows) {
    r.hidden = !r.hidden;
  }
}
</script>
